name: Build Executables

# Manual trigger (Actions tab → Build Executables → Run workflow), or push a
# tag like v1.8.4 to also cut a GitHub Release with both zips attached.
# This workflow is intentionally NOT part of ci.yml (which stays test-only,
# see tests/test_release.py's CI-policy guard) — it lives in this fork
# specifically to publish built binaries; ci.yml's parent project deliberately
# does not.
on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install -e .[browser]
          python -m pip install "PyInstaller>=6"

      - name: Build (PyInstaller)
        run: >-
          python -m PyInstaller auto-rollcall-thu-tronclass.spec
          --clean --noconfirm
          --distpath dist/pyinstaller
          --workpath build/pyinstaller-work

      - name: Smoke test
        shell: bash
        run: |
          BIN=dist/pyinstaller/auto-rollcall-thu-tronclass/auto-rollcall-thu-tronclass.exe
          "$BIN" --help
          "$BIN" status --json

      - name: Package zip
        id: package
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME:-dev-$(git rev-parse --short HEAD)}"
          NAME="THU_Auto_Rollcall-${VERSION}-windows-x64"
          mkdir -p dist/release
          cd dist/pyinstaller
          mv auto-rollcall-thu-tronclass "$NAME"
          zip -r "../release/${NAME}.zip" "$NAME" >/dev/null
          echo "path=dist/release/${NAME}.zip" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: ${{ steps.package.outputs.path }}
          retention-days: 30

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install -e .[browser]
          python -m pip install "PyInstaller>=6"

      - name: Build (PyInstaller)
        run: >-
          python -m PyInstaller auto-rollcall-thu-tronclass-mac.spec
          --clean --noconfirm
          --distpath dist/pyinstaller
          --workpath build/pyinstaller-work

      - name: Smoke test
        run: |
          BIN=dist/pyinstaller/auto-rollcall-thu-tronclass/auto-rollcall-thu-tronclass
          chmod +x "$BIN"
          "$BIN" --help
          "$BIN" status --json

      - name: Package zip
        id: package
        run: |
          VERSION="${GITHUB_REF_NAME:-dev-$(git rev-parse --short HEAD)}"
          NAME="THU_Auto_Rollcall-${VERSION}-macos-arm64"
          mkdir -p dist/release
          chmod +x "dist/pyinstaller/auto-rollcall-thu-tronclass/auto-rollcall-thu-tronclass"
          cd dist/pyinstaller
          mv auto-rollcall-thu-tronclass "$NAME"
          zip -r "../release/${NAME}.zip" "$NAME" >/dev/null
          echo "path=dist/release/${NAME}.zip" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: ${{ steps.package.outputs.path }}
          retention-days: 30

  release:
    # Only on a tag push (v1.8.4 etc.) — a manual "Run workflow" click just
    # leaves the two zips downloadable from the run's Artifacts panel above.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.zip
          generate_release_notes: true
